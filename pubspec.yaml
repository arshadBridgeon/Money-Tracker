name: money_tracker
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_fonts: ^8.0.2
  glassmorphism: ^3.0.0
  intl: ^0.20.2
  provider: ^6.1.5+1
  path_provider: ^2.1.5
  uuid: ^4.5.3
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  flutter_native_splash: ^2.4.4
  fl_chart: ^1.2.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  shared_preferences: ^2.5.5
  image_picker: ^1.2.2
  firebase_storage: ^13.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo2.png"

flutter_native_splash:
  color: "#0F172A"
  image: "assets/images/splash_logo.png"
  android_12:
    color: "#0F172A"
    image: "assets/images/splash_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
